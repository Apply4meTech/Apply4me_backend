<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #333;
    }
    .status {
      padding: 8px 12px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .status.connected {
      background: #d1fae5;
      color: #065f46;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0A66C2;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #004182;
    }
    .info {
      font-size: 12px;
      color: #6b7280;
      margin-top: 12px;
      line-height: 1.5;
    }
    .user-info {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }
    .user-info h4 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #0A66C2;
    }
    .save-info-btn {
      margin-top: 8px;
      background: #10b981;
    }
    .save-info-btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>
  <h3>Job Application Manager</h3>
  
  <div class="user-info">
    <h4>User ID</h4>
    <input type="text" id="userId" placeholder="Enter your user ID">
    <button id="saveInfoBtn" class="save-info-btn">Save User ID</button>
    <div class="info" id="infoMsg" style="display: none; margin-top: 8px;"></div>
  </div>
  
  <div class="info">
    Visit a LinkedIn job page and click "Save to Job Manager" button to save jobs.
  </div>
  <script src="popup.js"></script>
</body>
</html>
